name: SpeedrunMCAT
options:
  bundleIdPrefix: com.speedrun
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  SpeedrunMCAT:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
      - path: anki_ffi.h
      - path: Bridging-Header.h
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.speedrun.mcat
        SWIFT_OBJC_BRIDGING_HEADER: Bridging-Header.h
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Speedrun MCAT
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        # anki-ffi is a static lib; its transitive Rust/C deps need these:
        OTHER_LDFLAGS: ["-lc++", "-lz"]
    dependencies:
      - framework: AnkiRust.xcframework
        embed: false
